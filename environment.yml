name: autovus
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.0
  - pip=25.0
  - setuptools=75.8.0
  - wheel=0.45.1
  - ipykernel=6.30.1
  - ipython=9.5.0
  - jupyter_client=8.6.3
  - jupyter_core=5.8.1
  - lmdb=0.9.31
  - zeromq=4.3.5
  - pip:
    # ── core scientific stack ──────────────────────────────────────────────
    - numpy==2.2.4
    - pandas==2.2.3
    - scipy==1.15.2
    - scikit-learn==1.6.1
    - scikit-image==0.25.2
    - statsmodels==0.14.4
    - arch==7.2.0
    - patsy==1.0.1
    # ── deep learning ─────────────────────────────────────────────────────
    # Install torch with CUDA via: pip install torch --index-url https://download.pytorch.org/whl/cu121
    # For CPU-only (CLEPS CPU nodes): pip install torch (default below works too)
    - torch==2.11.0
    - torchvision==0.26.0
    - torchmetrics==1.9.0
    - llvmlite==0.44.0
    # ── visualisation ─────────────────────────────────────────────────────
    - matplotlib==3.10.1
    - seaborn==0.13.2
    - plotly==6.7.0
    - pillow==11.1.0
    - contourpy==1.3.1
    - cycler==0.12.1
    - fonttools==4.56.0
    - kiwisolver==1.4.8
    - pyparsing==3.2.1
    - imageio==2.37.0
    - tifffile==2025.2.18
    - lazy-loader==0.4
    # ── streamlit (demo / local only, skip on cluster if not needed) ───────
    - streamlit==1.57.0
    - altair==6.1.0
    - pydeck==0.9.2
    - narwhals==2.20.0
    - blinker==1.9.0
    - cachetools==7.1.1
    - gitpython==3.1.50
    - gitdb==4.0.12
    - smmap==5.0.3
    - watchdog==6.0.0
    - toml==0.10.2
    # ── web / async ────────────────────────────────────────────────────────
    - uvicorn==0.34.2
    - starlette==0.46.2
    - httpx==0.28.1
    - httpcore==1.0.9
    - httptools==0.7.1
    - h11==0.16.0
    - anyio==4.9.0
    - sniffio==1.3.1
    - websockets==15.0.1
    - requests==2.33.1
    - urllib3==2.6.3
    - certifi==2025.4.26
    - idna==3.10
    - charset-normalizer==3.4.7
