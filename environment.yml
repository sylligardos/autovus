    - pyarrow==24.0.0
    - fsspec==2025.3.0
    - filelock==3.17.0
    - networkx==3.4.2
    - sympy==1.14.0
    - mpmath==1.3.0
    # ── pydantic / typing ──────────────────────────────────────────────────
    - pydantic==2.11.4
    - pydantic-core==2.33.2
    - annotated-types==0.7.0
    - typing-extensions==4.12.2
    - typing-inspection==0.4.1
